<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Set Yet</title>
  <style>
    /* 全局重置与全屏 Flex 居中 */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 核心提示卡片 */
    .center-card {
      background: white;
      padding: 40px 60px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    /* 404 大标号 */
    .error-code {
      font-size: 72px;
      font-weight: 800;
      color: #e53e3e;
      margin: 0 0 10px 0;
      line-height: 1;
    }

    /* 主标题 */
    .center-card h3 {
      margin: 0 0 12px 0;
      font-size: 22px;
      color: #2d3748;
    }

    /* 副文本描述 */
    .center-card p {
      margin: 0 0 24px 0;
      color: #718096;
      font-size: 14px;
    }

    /* 返回首页按钮 */
    .back-btn {
      display: inline-block;
      padding: 10px 24px;
      background-color: #3182ce;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .back-btn:hover {
      background-color: #2b6cb0;
    }
  </style>
</head>
<body>

  <div class="center-card">
    <h3>Page Not Set Yet</h3>
    <a href="xiangjam" class="back-btn">返回湘与游</a>
  </div>

</body>
</html>
